```yaml
name: Download NuGet and Conda

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-tools:
    runs-on: windows-latest

    steps:
      - name: Download NuGet
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile "nuget.exe"

      - name: Download Conda (micromamba)
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64" `
            -OutFile "micromamba.exe"

      - name: Release portable tools
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-client-tools
          name: Portable NuGet and Conda Tools
          body: Portable Windows executables for NuGet and Conda.
          files: |
            nuget.exe
            micromamba.exe
