```yaml
name: Apache Answer TAR.GZ

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-answer:
    runs-on: ubuntu-latest

    steps:
      - name: Download Apache Answer archive
        run: |
          curl -fL \
            "https://www.apache.org/dyn/closer.lua/answer/2.0.3/apache-answer-2.0.3-bin-linux-amd64.tar.gz?action=download" \
            -o apache-answer-2.0.3-bin-linux-amd64.tar.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apache-answer-v2.0.3
          name: Apache Answer v2.0.3
          body: "Apache Answer 2.0.3 Linux AMD64 binary distribution, packaged as a TAR.GZ archive for offline use."
          files: |
            apache-answer-2.0.3-bin-linux-amd64.tar.gz
```
