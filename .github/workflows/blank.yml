name: Download Nexus Repository Releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-nexus:
    runs-on: ubuntu-latest

    steps:
      - name: Download Nexus 3.96.4
        run: |
          curl -fL \
            -o nexus-3.96.4-01-win-x86_64.zip \
            https://download.sonatype.com/nexus/3/nexus-3.96.4-01-win-x86_64.zip

      - name: Download Nexus 3.95.4
        run: |
          curl -fL \
            -o nexus-3.95.4-01-win-x86_64.zip \
            https://download.sonatype.com/nexus/3/nexus-3.95.4-01-win-x86_64.zip

      - name: Download Nexus 3.94.2
        run: |
          curl -fL \
            -o nexus-3.94.2-01-win-x86_64.zip \
            https://download.sonatype.com/nexus/3/nexus-3.94.2-01-win-x86_64.zip

      - name: Download Nexus 3.88.0
        run: |
          curl -fL \
            -o nexus-3.88.0-08-win-x86_64.zip \
            https://download.sonatype.com/nexus/3/nexus-3.88.0-08-win-x86_64.zip

      - name: Upload Nexus 3.96.4
        uses: actions/upload-artifact@v4
        with:
          name: nexus-3.96.4-01-win-x86_64
          path: nexus-3.96.4-01-win-x86_64.zip
          retention-days: 90

      - name: Upload Nexus 3.95.4
        uses: actions/upload-artifact@v4
        with:
          name: nexus-3.95.4-01-win-x86_64
          path: nexus-3.95.4-01-win-x86_64.zip
          retention-days: 90

      - name: Upload Nexus 3.94.2
        uses: actions/upload-artifact@v4
        with:
          name: nexus-3.94.2-01-win-x86_64
          path: nexus-3.94.2-01-win-x86_64.zip
          retention-days: 90

      - name: Upload Nexus 3.88.0
        uses: actions/upload-artifact@v4
        with:
          name: nexus-3.88.0-08-win-x86_64
          path: nexus-3.88.0-08-win-x86_64.zip
          retention-days: 90
