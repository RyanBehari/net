name: GitLab Runner Helper TAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-runner-helper:
    runs-on: ubuntu-latest

    steps:
      - name: Pull GitLab Runner Helper image
        run: |
          docker pull gitlab/gitlab-runner-helper:alpine3.21-x86_64-v19.4.1

      - name: Export Docker image to TAR
        run: |
          docker save \
            -o gitlab-runner-helper-alpine3.21-v19.4.1.tar \
            gitlab/gitlab-runner-helper:alpine3.21-x86_64-v19.4.1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gitlab-runner-helper-v19.4.1
          name: GitLab Runner Helper v19.4.1
          body: "GitLab Runner Helper Docker image exported as a TAR archive for offline use."
          files: |
            gitlab-runner-helper-alpine3.21-v19.4.1.tar
