```yaml
name: Download Portable NuGet and Conda Tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: windows-latest

    steps:
      - name: Download portable NuGet
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile "nuget.exe"

      - name: Download portable micromamba (Conda)
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64" `
            -OutFile "micromamba.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-client-tools
          name: Portable NuGet and Conda Tools
          body: |
            Portable Windows command-line tools.

            Included:
            - nuget.exe (NuGet CLI)
            - micromamba.exe (Conda-compatible package manager)
          prerelease: false
          make_latest: false
          files: |
            nuget.exe
            micromamba.exe
```
